<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Giro Supremo</title>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0b1020}
html,body{overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}

/* Layout: one full-height stage. DOM screens stack in #app; the battle screen puts the arena canvas between two HUD rows with a touch pad underneath. */
:root{
  --ink:#0b1020; --deck:#121a2e; --plate:#1b2540; --plate2:#263154; --edge:#3a4770;
  --text:#eaf0ff; --muted:#93a1c4; --gold:#ffc247; --gold-d:#b57d0a;
  --atk:#ff4d4d; --def:#4aa3ff; --sta:#46d39a; --bal:#b07cff;
  --good:#46d39a; --bad:#ff5c6c;
  --f-display:'sans-serif-black','Arial Black',Impact,sans-serif;
  --f-body:'sans-serif-condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#1a2650 0%,rgba(11,16,32,0) 60%),var(--ink);background-color:var(--ink);color:var(--text);font-family:var(--f-body);font-size:18px;font-weight:500;line-height:1.25;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:relative;height:100%;max-width:620px;margin:0 auto}
.screen{position:absolute;inset:0;display:none;flex-direction:column;gap:14px;padding-block:14px;overflow-y:auto;overflow-x:hidden;min-width:0}
.screen.on{display:flex}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-display);font-size:20px;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--f-display);font-size:17px;letter-spacing:.02em;text-transform:uppercase}
small,.cap{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{font-family:var(--f-display);font-size:15px;letter-spacing:.05em;text-transform:uppercase;border:0;border-radius:6px;padding:14px 18px;color:var(--text);background:var(--plate2);box-shadow:0 4px 0 #060914,inset 0 0 0 2px var(--edge);cursor:pointer;transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #060914,inset 0 0 0 2px var(--edge)}
.btn.gold{background:var(--gold);color:#2a1c00;box-shadow:0 4px 0 var(--gold-d),inset 0 0 0 2px #ffe3a0}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d),inset 0 0 0 2px #ffe3a0}
.btn.sm{padding:9px 12px;font-size:13px}
.btn.big{font-size:19px;padding:18px 20px}
.btn:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn[disabled]{opacity:.4;pointer-events:none}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.top h2{flex:1;text-align:center}
.chip{font-family:var(--f-display);font-size:14px;background:var(--deck);border-radius:5px;padding:8px 10px;box-shadow:inset 0 0 0 2px var(--edge);white-space:nowrap}
.chip.coins::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--gold);margin-right:7px;box-shadow:inset 0 0 0 2px var(--gold-d)}
.panel{background:var(--deck);border-radius:6px;box-shadow:inset 0 0 0 2px var(--edge);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
/* menu */
.hero{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px}
.hero .logo{font-family:var(--f-display);font-size:clamp(34px,11vw,56px);line-height:.95;text-align:center;letter-spacing:.01em;text-transform:uppercase;text-shadow:0 4px 0 #060914}
.hero .logo span{color:var(--gold)}
#heroCv{width:min(100%,300px);aspect-ratio:1;max-height:34vh}
.menuBtns{display:grid;gap:12px}
.menuBtns .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;padding:4px 7px;border-radius:4px;background:var(--plate2);text-transform:uppercase;white-space:nowrap}
.tag.boss{background:var(--gold);color:#2a1c00}
.tag.good{background:var(--good);color:#04241a}
.tag.bad{background:var(--bad);color:#2a0409}
/* select */
.foe{display:flex;gap:12px;align-items:center;padding:12px;border-radius:6px;background:var(--deck);box-shadow:inset 0 0 0 2px var(--c,var(--edge))}
.foe .line{color:var(--muted);font-style:italic}
canvas.thumb{width:72px;height:72px;flex:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--deck);border-radius:6px;box-shadow:inset 0 0 0 2px var(--edge);cursor:pointer;border:0;color:var(--text);font:inherit;text-align:left;min-width:0}
.card.on{box-shadow:inset 0 0 0 3px var(--c);background:var(--plate)}
.card .hd{display:flex;gap:8px;align-items:center}
.card .hd b{font-family:var(--f-display);font-size:14px;text-transform:uppercase;color:var(--c)}
.card .hd small{display:block;letter-spacing:.06em}
.srow{display:grid;grid-template-columns:34px 1fr 26px;gap:6px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.srow .bar{height:7px}
.srow em{font-style:normal;color:var(--text);text-align:right;font-weight:700}
.bar{position:relative;height:14px;background:#080d1b;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--edge)}
.bar>i{position:absolute;inset:0;transform-origin:left center;background:var(--c,var(--gold))}
.bar>u{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.spdesc b{color:var(--c);font-family:var(--f-display);font-size:14px;text-transform:uppercase}
/* map */
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--deck);border-radius:6px;box-shadow:inset 0 0 0 2px var(--edge);border:0;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.stage[disabled]{opacity:.45;cursor:default}
.stage.cur{box-shadow:inset 0 0 0 3px var(--gold);background:var(--plate)}
.stage.boss .ix{background:var(--gold);color:#2a1c00}
.stage .ix{font-family:var(--f-display);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--plate2);font-size:15px}
.stage .nm{font-family:var(--f-display);font-size:15px;text-transform:uppercase}
.stage .sub{color:var(--muted);font-size:15px;display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--c)}
/* shop */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{padding:10px 4px;border:0;border-radius:6px;background:var(--deck);color:var(--muted);font-family:var(--f-display);font-size:12px;text-transform:uppercase;box-shadow:inset 0 0 0 2px var(--edge);cursor:pointer}
.tab.on{color:var(--text);box-shadow:inset 0 0 0 3px var(--c);background:var(--plate)}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.form{padding:8px;border-radius:5px;background:#0d1426;text-align:center;font-size:14px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--edge)}
.form.on{color:var(--text);box-shadow:inset 0 0 0 2px var(--c)}
.form b{display:block;font-family:var(--f-display);font-size:11px;text-transform:uppercase}
.up{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center}
.up .bar{height:12px}
.up .bar i{background:var(--c)}
.up b{font-size:16px}
.up .btn{min-width:78px}
.xp{--c:var(--gold)}
/* quick */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:11px 14px;border:0;border-radius:6px;background:var(--deck);color:var(--text);font-family:var(--f-display);font-size:13px;text-transform:uppercase;box-shadow:inset 0 0 0 2px var(--edge);cursor:pointer}
.opt.on{box-shadow:inset 0 0 0 3px var(--c,var(--gold));background:var(--plate)}
/* records */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px;background:var(--deck);border-radius:6px;box-shadow:inset 0 0 0 2px var(--edge);text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.ach{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:6px;background:var(--deck);box-shadow:inset 0 0 0 2px var(--edge)}
.ach.off{opacity:.5}
.ach b{font-family:var(--f-display);font-size:14px;text-transform:uppercase}
.ach p{color:var(--muted);font-size:16px}
/* battle */
#battle{gap:8px;padding-block:10px;overflow:hidden;touch-action:none}
.hud{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center}
.hud .who{display:flex;flex-direction:column;min-width:0}
.hud .nm{font-family:var(--f-display);font-size:15px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .meta{font-style:normal;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .bars{display:flex;flex-direction:column;gap:4px}
.hud .en{height:6px}
#arenaWrap{position:relative;flex:1 1 0;min-height:0;aspect-ratio:1;align-self:center;max-width:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#callout{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--f-display);font-size:clamp(22px,7vw,40px);pointer-events:none;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.7);text-transform:uppercase;padding:0 8px}
#callout.go{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}14%{opacity:1;transform:scale(1.08)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
#count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(70px,24vw,140px);pointer-events:none;text-shadow:0 5px 0 rgba(0,0,0,.6);color:var(--gold)}
#launch{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(0deg,rgba(8,12,24,.95),rgba(8,12,24,.75));border-radius:8px;display:flex;flex-direction:column;gap:10px;text-align:center}
#launch .intro{font-size:16px;color:var(--muted)}
#launch .intro b{color:var(--gold);font-family:var(--f-display);text-transform:uppercase;font-size:14px}
.gauge{position:relative;height:26px;border-radius:5px;background:linear-gradient(90deg,#7a2430 0%,#a8742b 28%,#46d39a 46%,#46d39a 54%,#a8742b 72%,#7a2430 100%);box-shadow:inset 0 0 0 2px #060914}
.gauge i{position:absolute;top:-5px;bottom:-5px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 0 2px #060914}
#pad{flex:0 0 clamp(130px,23%,190px);display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
#pad .hint{color:var(--muted);font-size:15px;max-width:48%;line-height:1.2}
#spBtn{--c:var(--gold);--p:0;position:relative;width:118px;height:118px;border-radius:50%;border:0;cursor:pointer;color:var(--text);font-family:var(--f-display);font-size:13px;text-transform:uppercase;background:conic-gradient(var(--c) calc(var(--p)*1%),#1a2240 0);display:grid;place-items:center;touch-action:none}
#spBtn::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--plate);box-shadow:inset 0 0 0 2px var(--edge)}
#spBtn span{position:relative;text-align:center;line-height:1.05;padding:0 10px}
#spBtn.ready{animation:glow .7s ease-in-out infinite alternate}
#spBtn.ready::before{background:var(--c);}
#spBtn.ready span{color:#1a1200}
@keyframes glow{from{box-shadow:0 0 0 0 var(--c)}to{box-shadow:0 0 26px 6px var(--c)}}
#pauseBtn{position:absolute;right:0;top:-6px;padding:7px 11px}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);pointer-events:none;z-index:5}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.35)}
.overlay{position:absolute;inset:0;background:rgba(6,9,20,.88);display:flex;align-items:center;justify-content:center;padding:14px;z-index:8;overflow:auto}
.overlay .box{width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:stretch}
.overlay .big{font-family:var(--f-display);font-size:clamp(30px,9vw,46px);text-transform:uppercase;line-height:1;text-shadow:0 4px 0 #060914}
.win{color:var(--gold)}.lose{color:var(--bad)}
.rew{display:flex;flex-direction:column;gap:6px;text-align:left}
.rew .r{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--deck);border-radius:5px}
.rew .r b{font-variant-numeric:tabular-nums}
.note{padding:8px 10px;border-radius:5px;background:var(--plate2);box-shadow:inset 0 0 0 2px var(--gold);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(6,9,20,.92);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20;overflow:auto}
#modal .panel{max-width:520px;width:100%}
#modal li{margin:0 0 8px 18px}
#modal ul{padding:0;margin:0}
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:30}
.toast{background:var(--gold);color:#2a1c00;font-family:var(--f-display);font-size:13px;text-transform:uppercase;padding:10px 14px;border-radius:6px;box-shadow:0 4px 0 var(--gold-d);animation:fade 2.8s forwards}
@media (prefers-reduced-motion:reduce){#callout.go{animation:fade 1.1s}#spBtn.ready{animation:none}.toast{animation:fade 2.8s forwards}}
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="screen on"></section>
  <section id="select" class="screen"></section>
  <section id="map" class="screen"></section>
  <section id="shop" class="screen"></section>
  <section id="quick" class="screen"></section>
  <section id="records" class="screen"></section>
  <section id="battle" class="screen">
    <div class="hud" id="hudE"><div class="who"><b class="nm"></b><em class="meta"></em></div><div class="bars"><div class="bar sp"><i></i><u></u></div><div class="bar en"><i></i></div></div></div>
    <div id="arenaWrap">
      <canvas id="cv"></canvas>
      <div id="callout"></div>
      <div id="count"></div>
      <div id="launch" hidden>
        <p class="intro"></p>
        <div class="gauge"><i id="gmark" style="left:0%"></i></div>
        <button class="btn gold big" data-act="launch">Lançar</button>
      </div>
    </div>
    <div class="hud" id="hudP"><div class="who"><b class="nm"></b><em class="meta"></em></div><div class="bars"><div class="bar sp"><i></i><u></u></div><div class="bar en"><i></i></div></div></div>
    <div id="pad">
      <p class="hint">Arraste o dedo para mover o pião. Setas ou WASD no teclado.</p>
      <button id="spBtn" aria-label="Golpe especial"><span id="spLbl">Especial</span></button>
      <button id="pauseBtn" class="btn sm" data-act="pause" aria-label="Pausar">II</button>
    </div>
    <div id="stick" hidden><i></i></div>
    <div id="pauseO" class="overlay" hidden><div class="box"><div class="big">Pausa</div><button class="btn gold big" data-act="resume">Continuar</button><button class="btn" data-act="quit">Desistir da luta</button></div></div>
    <div id="result" class="overlay" hidden></div>
  </section>
</div>
<div id="modal" hidden></div>
<div id="toasts"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const K=['atk','def','sta','spd'],KN={atk:'Ataque',def:'Defesa',sta:'Resist.',spd:'Veloc.'};
const TYPES={
 atk:{name:'Ataque',color:'#ff4d4d',base:{atk:8,def:3,sta:4,spd:8},mass:1.0,spName:'Investida Meteoro',spDesc:'Dispara contra o rival num golpe devastador, com dano e impacto enormes.'},
 def:{name:'Defesa',color:'#4aa3ff',base:{atk:3,def:8,sta:5,spd:4},mass:1.45,spName:'Escudo de Aço',spDesc:'Cria uma barreira por 3 segundos: quase não sofre dano e repele quem estiver perto.'},
 sta:{name:'Resistência',color:'#46d39a',base:{atk:4,def:5,sta:9,spd:5},mass:1.1,spName:'Segundo Fôlego',spDesc:'Recupera giro na hora e para de perdê-lo por 4 segundos.'},
 bal:{name:'Equilíbrio',color:'#b07cff',base:{atk:6,def:6,sta:6,spd:6},mass:1.2,spName:'Redemoinho',spDesc:'Cria um vórtice que puxa o rival e drena o giro dele enquanto estiver perto.'}
};
const ADV={atk:'sta',sta:'def',def:'atk'};
const adv=(a,d)=>ADV[a]===d?1.25:ADV[d]===a?0.8:1;
const FORM_NAMES=['','Forma Base','Forma Avançada','Forma Suprema'],FORM_MULT=[0,1,1.25,1.5];
const formOf=l=>l>=6?3:l>=3?2:1,needXp=l=>50+30*l,MAXLV=10;
const ARENAS=[
 {n:'Quintal',f1:'#33466d',f2:'#18233f',rim:'#7fa6ff',lines:8},
 {n:'Ginásio',f1:'#5a3550',f2:'#2a1626',rim:'#ff7a9c',lines:12},
 {n:'Porto',f1:'#1f5560',f2:'#0d2a33',rim:'#4fe0d0',lines:10},
 {n:'Ruínas',f1:'#5b4f36',f2:'#2b2416',rim:'#e3c16f',lines:6},
 {n:'Vulcão',f1:'#6a2e1f',f2:'#2a110c',rim:'#ff8a3d',lines:14},
 {n:'Templo Ônix',f1:'#2f3b52',f2:'#0f141f',rim:'#9fb4d8',lines:16},
 {n:'Cúpula Escarlate',f1:'#6b2236',f2:'#26090f',rim:'#ff5470',lines:5},
 {n:'Coliseu Zero',f1:'#40306b',f2:'#140d2a',rim:'#c9a6ff',lines:20}];
const STAGES=[
 {n:'Tico Ventania',t:'bal',line:'Vamos ver se você aguenta o meu ritmo!'},
 {n:'Lara Faísca',t:'atk',line:'Eu não desvio. Eu atravesso!'},
 {n:'Bruno Muralha',t:'def',line:'Pode bater à vontade. Eu não saio daqui.'},
 {n:'Nina Maré',t:'sta',line:'Quem gira por último, ri melhor.'},
 {n:'Capitão Vórtice',t:'bal',line:'Cada arena tem um dono. Esta é minha.'},
 {n:'Mestre Ônix',t:'def',boss:1,line:'Dez anos sem perder em casa. Mostre o que sabe.'},
 {n:'Dragoa Escarlate',t:'atk',boss:1,line:'Meu giro é fogo. Tente não se queimar!'},
 {n:'Imperador Zero',t:'bal',boss:1,final:1,line:'Só existe um campeão. Vai ser você ou eu.'}];
const DIFFS=[{n:'Fácil',bonus:0,skill:.3,aggr:.4,mul:.8},{n:'Normal',bonus:3,skill:.6,aggr:.6,mul:1.2},{n:'Difícil',bonus:6,skill:.9,aggr:.85,mul:1.7}];
const NAMES=['Rex Rotor','Maya Pião','Dante Axis','Kai Turbilhão','Luna Giroflex','Bento Eixo'];
const ACH={
 first_win:['Primeiro Giro','Vença uma batalha.'],perfect:['Lançamento Perfeito','Pare o marcador no centro.'],
 ringout:['Fora da Arena','Vença por ring out.'],combo:['Combo de 5','Acerte 5 golpes seguidos.'],
 sp10:['Showman','Use 10 golpes especiais.'],boss:['Caçador de Chefes','Derrote um chefe.'],
 flawless:['Giro Intacto','Vença com metade do giro ou mais.'],streak5:['Em Chamas','Vença 5 batalhas seguidas.'],
 master:['Mestre do Giro','Leve um pião ao nível 10.'],champion:['Campeão','Vença o Imperador Zero.']};
/* save */
const KEY='giro-supremo-v1';
const defSave=()=>({coins:0,blades:Object.fromEntries(Object.keys(TYPES).map(t=>[t,{xp:0,lvl:1,up:{atk:0,def:0,sta:0,spd:0}}])),
 prog:{stage:0,cycle:0},stats:{wins:0,losses:0,streak:0,best:0,specials:0,ringouts:0,bosses:0,titles:0,perfects:0},ach:{},mute:false,seen:false,last:'bal'});
function merge(a,b){for(const k in b){if(a[k]&&typeof a[k]==='object'&&typeof b[k]==='object')merge(a[k],b[k]);else a[k]=b[k];}return a;}
let S=(()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.blades)return merge(defSave(),j);}catch(e){}return defSave();})();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

function upd(f,o,h){
 f.dash=Math.max(0,f.dash-h);f.shield=Math.max(0,f.shield-h);f.wind=Math.max(0,f.wind-h);f.vortex=Math.max(0,f.vortex-h);f.flash=Math.max(0,f.flash-h*4);

 if(alive){if(f.isP){ix=input.x;iy=input.y;}else{const d=aiThink(f,o,h);ix=d.x;iy=d.y;}}
 const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
 const spf=.45+.55*Math.min(1,f.spin/100);
 const thrust=(300+f.st.spd*48)*spf*(f.wind>0?1.15:1);
 let ax=ix*thrust,ay=iy*thrust;
 const d=Math.hypot(f.x,f.y)||1;
 if(!f.out){const pull=1.2*d+.0035*d*d;ax-=f.x/d*pull;ay-=f.y/d*pull;}

  if(dd<o.vr){const kk=(1-dd/o.vr*.5)*640*o.fm;ax+=dx/dd*kk;ay+=dy/dd*kk;f.spin-=7*o.fm*h*(f.shield>0?.15:1);}}
 if(f.dash>0&&alive){const dx=o.x-f.x,dy=o.y-f.y,dd=Math.hypot(dx,dy)||1,s=Math.min(1,h*9);f.vx+=(dx/dd*980*f.fm-f.vx)*s;f.vy+=(dy/dd*980*f.fm-f.vy)*s;}

function aiThink(f,o,h){

function stepBattle(dt){

function drawBattle(){

 const sx=B.shake>.1?rnd(-1,1)*B.shake*.6:0,sy=B.shake>.1?rnd(-1,1)*B.shake*.6:0;
 c.save();c.translate(sx,sy);if(arenaCache)c.drawImage(arenaCache,0,0,cw,ch);
 c.translate(cw/2,ch/2);c.scale(kk,kk);
 const a=B.arena;
 for(let i=0;i<28;i++){const th=i/28*TAU,on=((i+Math.floor(B.vis*10))%4===0);c.beginPath();c.arc(Math.cos(th)*(R+16),Math.sin(th)*(R+16),on?4:2.4,0,TAU);c.fillStyle=on?'#fff':a.rim;c.globalAlpha=on?1:.55;c.fill();}
 c.globalAlpha=1;
 for(const f of [B.e,B.p]){
  f.trail.unshift({x:f.x,y:f.y});if(f.trail.length>14)f.trail.pop();
  const col=TYPES[f.type].color;
  for(let i=f.trail.length-1;i>0;i--){const t=f.trail[i];c.globalAlpha=(1-i/f.trail.length)*.28;c.fillStyle=col;c.beginPath();c.arc(t.x,t.y,f.r*(1-i/f.trail.length*.6),0,TAU);c.fill();}

  c.restore();
  const wob=f.dead&&!f.out?Math.sin(B.vis*30)*3:0;
  c.save();c.translate(f.x+wob,f.y);c.scale(sc,sc);
  if(f.shield>0){c.beginPath();c.arc(0,0,f.r*1.9,0,TAU);c.fillStyle='rgba(120,190,255,.18)';c.fill();c.lineWidth=3;c.strokeStyle='rgba(160,215,255,'+(.6+.3*Math.sin(B.vis*12))+')';c.stroke();}
  if(f.vortex>0){c.rotate(B.vis*5);for(let i=0;i<3;i++){c.rotate(TAU/3);c.beginPath();c.arc(0,0,f.vr*.5,0,Math.PI*1.1);c.lineWidth=3;c.strokeStyle='rgba(176,124,255,.5)';c.stroke();}
   c.beginPath();c.arc(0,0,f.vr,0,TAU);c.setLineDash([10,12]);c.strokeStyle='rgba(176,124,255,.55)';c.lineWidth=2;c.stroke();c.setLineDash([]);c.rotate(-B.vis*5);}
  if(f.wind>0){c.beginPath();c.arc(0,0,f.r*1.5+Math.sin(B.vis*10)*3,0,TAU);c.lineWidth=3;c.strokeStyle='rgba(70,211,154,.7)';c.stroke();}
  if(f.dash>0){const sp=Math.hypot(f.vx,f.vy)||1;c.beginPath();c.moveTo(0,0);c.lineTo(-f.vx/sp*90,-f.vy/sp*90);c.lineWidth=f.r*1.4;c.lineCap='round';c.strokeStyle='rgba(255,90,60,.45)';c.stroke();}
  c.restore();
  c.save();c.translate(f.x+wob,f.y);c.scale(sc,sc);c.translate(-(f.x+wob),-f.y);
  drawBlade(c,f.x+wob,f.y,f.r,f.type,f.ang,f.form,f.flash);c.restore();
  if(f.form>=3&&!f.out&&Math.random()<.5)B.parts.push({x:f.x+rnd(-f.r,f.r),y:f.y+rnd(-f.r,f.r),vx:rnd(-30,30),vy:rnd(-60,-20),life:.5,max:.6,color:col,size:2.5});
 }
 for(const r of B.rings){const p=r.t/r.dur;c.beginPath();c.arc(r.x,r.y,r.r0+(r.r1-r.r0)*p,0,TAU);c.globalAlpha=1-p;c.lineWidth=5;c.strokeStyle=r.color;c.stroke();c.globalAlpha=1;}
 for(const p of B.parts){c.globalAlpha=clamp(p.life/p.max,0,1);c.fillStyle=p.color;c.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}

function finishBattle(){
 const ctx=B.ctx,en=ctx.enemy,win=B.win,lines=[],notes=[];let coins=0,xp=0;
 S.stats.played=(S.stats.played||0)+1;
 if(win){
  S.stats.wins++;S.stats.streak++;S.stats.best=Math.max(S.stats.best,S.stats.streak);
  if(ctx.mode==='tourney'){const i=ctx.stageIdx,st=STAGES[i],replay=i<S.prog.stage;
   coins=Math.round((40+i*15+(st.boss?60:0)+S.prog.cycle*20)*(replay?.5:1));xp=Math.round((30+i*10)*(st.boss?1.6:1)*(replay?.6:1));
   if(!replay&&i===S.prog.stage){S.prog.stage++;if(S.prog.stage>=STAGES.length){S.prog.stage=0;S.prog.cycle++;S.stats.titles++;ctx.champion=true;award('champion');notes.push('Você é o Campeão Supremo! Os rivais voltam mais fortes no próximo ciclo.');}}
   if(st.boss){S.stats.bosses++;award('boss');}}
  else{const d=DIFFS[ctx.diff];coins=Math.round(25*d.mul);xp=Math.round(20*d.mul);}
  if(B.perfect)coins+=10;
  award('first_win');if(B.reason==='ring'){S.stats.ringouts++;award('ringout');}
  if(B.p.spin/B.p.spinMax>=.5)award('flawless');if(S.stats.streak>=5)award('streak5');
 }else{S.stats.losses++;S.stats.streak=0;coins=8;xp=8;}
 S.coins+=coins;const bl=S.blades[B.p.type],before=bl.lvl;
 if(bl.lvl<MAXLV)bl.xp+=xp;
 while(bl.lvl<MAXLV&&bl.xp>=needXp(bl.lvl)){bl.xp-=needXp(bl.lvl);bl.lvl++;notes.push('Nível '+bl.lvl+'! Todos os atributos subiram.');
  if(bl.lvl===3||bl.lvl===6)notes.push('Evolução: '+FORM_NAMES[formOf(bl.lvl)]+' desbloqueada! Seu especial ficou mais forte.');}
 if(bl.lvl>before)SFX.up();if(bl.lvl>=MAXLV)award('master');
 persist();win?SFX.win():SFX.lose();
 const pct=bl.lvl>=MAXLV?100:Math.round(bl.xp/needXp(bl.lvl)*100);
 let btns='';
 if(ctx.mode==='tourney'){
  btns=win?`<button class="btn gold big" data-act="next">${ctx.champion?'Voltar ao mapa':'Próxima luta'}</button><button class="btn" data-act="menu">Menu</button>`
   :`<button class="btn gold big" data-act="retry">Tentar de novo</button><button class="btn" data-act="shop">Oficina</button><button class="btn" data-act="menu">Menu</button>`;}
 else btns=`<button class="btn gold big" data-act="retry">Revanche</button><button class="btn" data-act="menu">Menu</button>`;
 const why=B.reason==='ring'?(win?'Você jogou o rival para fora!':'Você saiu da arena.'):(win?'O giro do rival chegou a zero.':'Seu giro chegou a zero.');
 $('#result').innerHTML=`<div class="box"><div class="big ${win?'win':'lose'}">${ctx.champion?'Campeão!':win?'Vitória!':'Derrota'}</div><p>${why}</p>
  <div class="rew"><div class="r"><span>Fragmentos</span><b>+${coins}</b></div><div class="r"><span>XP do pião (Nv ${bl.lvl})</span><b>+${xp}</b></div>
  <div class="bar xp"><i style="transform:scaleX(${pct/100})"></i></div>${B.maxCombo>1?`<div class="r"><span>Maior combo</span><b>${B.maxCombo}x</b></div>`:''}</div>
  ${notes.map(n=>`<div class="note">${n}</div>`).join('')}${btns}</div>`;
 $('#result').hidden=false;
}

 tourney(){renderMap();show('map');},
 quick(){renderQuick();show('quick');},
 shop(){renderShop();show('shop');},
 records(){resetArm=false;renderRecords();show('records');},
 howto,closeModal(){$('#modal').hidden=true;S.seen=true;persist();},
 mute(){S.mute=!S.mute;persist();renderMenu();},
 back(){pending&&pending.mode==='tourney'?ACT.tourney():ACT.quick();},
 stage(el){openSelect({mode:'tourney',stageIdx:+el.dataset.i});},
 pick(el){sel=el.dataset.t;renderSelect();},
 fight(){pending.pType=sel;startBattle(pending);},
 shopTab(el){shopT=el.dataset.t;renderShop();},
 buy(el){const k=el.dataset.k,b=S.blades[shopT],c=upCost(shopT,k);if(S.coins>=c&&b.up[k]<8){S.coins-=c;b.up[k]++;persist();SFX.up();renderShop();}},
 qEnemy(el){qs.enemy=el.dataset.t;renderQuick();},qDiff(el){qs.diff=+el.dataset.i;renderQuick();},
 qGo(){openSelect({mode:'quick',diff:qs.diff,enemyType:qs.enemy});},
 reset(){if(!resetArm){resetArm=true;renderRecords();return;}S=defSave();persist();resetArm=false;ACT.menu();},
 launch(){doLaunch();},pause(){togglePause();},resume(){togglePause();},
 quit(){S.stats.losses++;S.stats.streak=0;persist();ACT.menu();},
 next(){if(!pending.champion&&pending.stageIdx+1===S.prog.stage)openSelect({mode:'tourney',stageIdx:S.prog.stage});else ACT.tourney();},
 retry(){const c=pending;if(c.mode==='tourney')openSelect({mode:'tourney',stageIdx:c.stageIdx});else openSelect({mode:'quick',diff:c.diff,enemyType:c.enemyType});}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;audio();SFX.click();f(el);});
/* ===== main loop ===== */
const heroCv=()=>$('#heroCv');let last=0,t0=0;
function drawThumbs(ts){
 $$('.screen.on canvas.thumb').forEach(c=>{const g=c.getContext('2d'),w=c.width;g.clearRect(0,0,w,w);drawBlade(g,w/2,w/2,w*.36,c.dataset.t,ts/1000*(8+ +c.dataset.f*2),+c.dataset.f,0);});
 const h=heroCv();if(h&&screen==='menu'){const g=h.getContext('2d'),w=h.width;g.clearRect(0,0,w,w);const ts2=ts/1000;
  g.beginPath();g.arc(w/2,w/2,w*.43,0,TAU);g.strokeStyle='rgba(255,194,71,.25)';g.lineWidth=4;g.setLineDash([14,12]);g.stroke();g.setLineDash([]);
  ['atk','def','sta','bal'].forEach((t,i)=>{const a=ts2*.6+i*TAU/4;drawBlade(g,w/2+Math.cos(a)*w*.3,w/2+Math.sin(a)*w*.3,w*.12,t,ts2*14+i,3,0);});}
}
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(screen==='battle'&&B&&!B.paused&&B.phase!=='done'){stepBattle(dt);updHud();}
 if(screen==='battle')drawBattle();else drawThumbs(ts);}

window.giroBack=()=>{const m=$('#modal');if(!m.hidden){ACT.closeModal();return true;}
 if(screen==='battle'){if(!$('#result').hidden){ACT.menu();return true;}if(B&&B.paused){ACT.quit();return true;}togglePause();return true;}
 if(screen!=='menu'){ACT.menu();return true;}return false;};
window.giroPause=()=>{if(B&&screen==='battle'&&!B.paused&&B.phase!=='done'&&B.phase!=='launch')togglePause();};
renderMenu();if(!S.seen)setTimeout(howto,300);
requestAnimationFrame(frame);
})();
</script>
